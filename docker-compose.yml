version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: misan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: misan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-misanpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: misan-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-misanpassword123}@postgres:5432/misan
      NODE_ENV: production
    volumes:
      - ./apps/bot:/app/apps/bot
      - ./packages:/app/packages

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    container_name: misan-website
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-misanpassword123}@postgres:5432/misan
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_BOT_NAME: Misan
      NEXT_PUBLIC_BOT_INVITE: ${NEXT_PUBLIC_BOT_INVITE}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
